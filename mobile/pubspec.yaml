name: ziva_finance
description: "Ziva Finance Mobile Companion - Cross-platform personal budget and wealth command center with Shorebird OTA and offline SQLite sync."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Biometric Authentication (Face ID / Touch ID / Device Passcode)
  local_auth: ^2.3.0

  # Offline-First SQLite Database Engine
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Shorebird Over-The-Air (OTA) Live Code Patching
  shorebird_code_push: ^2.0.0

  # Network & Real-Time Sync Telemetry
  connectivity_plus: ^6.1.3
  http: ^1.3.0

  # Utilities & Formatting
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  sqflite_common_ffi_web: ^1.1.2
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/credentials/
